version: '3.1'

services:

  fuseki:
    ## Example:
    ## command: [ "--tdb2", "--update", "--loc", "databases/DB2", "/ds" ]
    build:
      context: jena-fuseki-docker-4.9.0/
      dockerfile: Dockerfile
    image: fuseki
    ports:
      - "3030:3030"
    volumes:
      - ./jena-fuseki-docker-4.9.0/logs:/fuseki/logs
      - ./jena-fuseki-docker-4.9.0/databases:/fuseki/databases
      - ./jena-fuseki-docker-4.9.0/config:/fuseki/config
    #command: ["--conf", "config/config.ttl", "--update", "--loc", "databases/MEM", "/modelg"]
    command: ["--conf", "config/config.ttl"]
    #command: ["--update", "--mem", "/modelg"]
    healthcheck:
      test: curl --fail http://localhost:3030/$/ping || exit 1
      start_interval: 5s
      interval: 200s
      timeout: 30s
      retries: 3
      start_period: 5s
    networks:
      - backend

  flask:
    build: 
      context: .
      dockerfile: flask_docker/Dockerfile

    #command: /bin/bash
    #stdin_open: true # docker run -i
    #tty: true # docker run -t
    ports:
      - "5000:5000"
    volumes:
      - ./flask-app:/app
      - ./src:/src

    command: [ "flask", "run","--host","0.0.0.0","--port","5000", "--debug"]

    depends_on:
      fuseki:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge
